name: Test shiur run (both voice engines)

# Runs the regular and/or the live voice engine on a TEST SHIUR -- the video the
# voice models are tuned on (currently R' Sruly Bornstein's "Bechoros 58",
# TWCiP96dKXU; before it "Bechoros 2", Zsy7oDUP6Pw) -- and saves each result as the next numbered run under
# test-runs/<videoId>/ on the results branch. The player offers every run in two
# dropdowns (one per engine) to every reader, so a change to an engine can be
# judged by playing the same stretch of the same shiur under the old and new runs.
#
#   Regular engine: dispatches the ordinary run-voice-job (voice-job.yml) with
#     testRun: true, which also publishes the alignment as "Regular #N". That job
#     runs on main with its own secrets (YouTube cookies, ElevenLabs, Claude).
#   Live engine: runs here -- transcribes the video with ElevenLabs, then plays
#     the transcript through live-matcher.js exactly as Live Follow's video
#     mode does (tools/test-shiur/live-engine.mjs) and publishes "Live #N".
#
# Run it from main after merging a change to either engine: the number and the
# note ("what changed") are what tell the runs apart afterwards.
#
# The regular engine can be run more than one way, to compare them on the same
# shiur (each is its own numbered run, named with how it was made):
#   aligner   path   -- the whole shiur as one ordered path (path_align.py)
#             phrase -- the older phrase-by-phrase matcher alone
#   witnesses which transcripts the path is given: "hints,plain" (two
#             transcriptions), "hints" (one), "hints,plain,slow" (three; "slow"
#             is the audio played at 0.75 speed). Add "relisten" to listen again
#             to just the holes the path left (voice_align.relisten_holes).
#
# The first job also makes sure the video IS a test shiur on the results branch
# (its video-links files, and the catalog), so a new one needs nothing by hand.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video id of the test shiur'
        required: true
        default: 'TWCiP96dKXU'
      refs:
        # Bechoros 58 opens four lines from the bottom of 57b and runs a few
        # lines into 59a, so both are given; the publisher treats them as
        # passing through (publish_alignment.split_refs), not as this shiur's own.
        description: 'The amudim the shiur covers, comma separated (include the amud before and after if it reads into them)'
        required: true
        default: 'Bekhorot 57b,Bekhorot 58a,Bekhorot 58b,Bekhorot 59a'
      maggid:
        description: "The maggid's id (bornstein), or empty for Mercaz Daf Yomi"
        required: false
        default: 'bornstein'
      engines:
        description: 'Which engine(s) to run'
        type: choice
        options: [both, regular, live]
        default: both
      aligner:
        description: 'Regular engine: path (whole shiur as one path) or phrase (the older matcher)'
        type: choice
        options: [path, phrase]
        default: path
      witnesses:
        description: 'Regular engine, path only: transcripts to use (hints / hints,plain / hints,plain,slow / hints,plain,relisten)'
        required: false
        default: 'hints,plain'
      stt_model:
        description: 'Regular engine: the ElevenLabs Scribe model to transcribe with'
        type: choice
        options: [scribe_v2, scribe_v3]
        default: scribe_v2
      notes:
        description: 'What changed since the last run (shown in the dropdown)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make sure the video is a test shiur on the results branch
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          REFS: ${{ inputs.refs }}
          MAGGID: ${{ inputs.maggid }}
        run: |
          set -e
          git config user.name "dafsync-bot"
          git config user.email "dafsync-bot@users.noreply.github.com"
          git fetch origin results
          git worktree add /tmp/results-checkout origin/results
          node MDYsync/tools/test-shiur/register.mjs --results /tmp/results-checkout \
            --video-id "$VIDEO_ID" --refs "$REFS" ${MAGGID:+--maggid "$MAGGID"}
          node MDYsync/tools/build-video-catalog.mjs --results /tmp/results-checkout
          cd /tmp/results-checkout
          git add video-links catalog.json
          if git diff --cached --quiet; then
            echo "Already a test shiur; nothing to change."
            exit 0
          fi
          git commit -m "Mark ${VIDEO_ID} as a test shiur"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:results; then
              break
            fi
            git fetch origin results
            git rebase origin/results
            sleep 2
          done

  regular:
    if: inputs.engines == 'both' || inputs.engines == 'regular'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the regular engine's job
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ inputs.video_id }}
          REFS: ${{ inputs.refs }}
          MAGGID: ${{ inputs.maggid }}
          NOTES: ${{ inputs.notes }}
          ALIGNER: ${{ inputs.aligner }}
          WITNESSES: ${{ inputs.witnesses }}
          STT_MODEL: ${{ inputs.stt_model }}
        run: |
          set -e
          python3 - <<'PY' > payload.json
          import json, os, uuid
          refs = [r.strip() for r in os.environ['REFS'].split(',') if r.strip()]
          aligner = os.environ.get('ALIGNER') or 'path'
          witnesses = (os.environ.get('WITNESSES') or 'hints,plain').replace(' ', '')
          # How the run was made goes into its name, so two ways of running the
          # same engine can be told apart in the dropdown.
          made = 'phrase matcher' if aligner == 'phrase' else 'path: ' + witnesses.replace(',', ' + ')
          stt_model = os.environ.get('STT_MODEL') or 'scribe_v2'
          if stt_model != 'scribe_v2':
              made += ', ' + stt_model.replace('scribe_v', 'Scribe v')
          notes = os.environ.get('NOTES', '').strip()
          payload = {
              'youtubeUrl': 'https://www.youtube.com/watch?v=' + os.environ['VIDEO_ID'],
              'refs': refs,
              'jobId': uuid.uuid4().hex,
              'variant': 'regular',
              'language': 'en',
              'testRun': 'true',
              'testNotes': f'{notes} ({made})' if notes else made,
          }
          # GitHub refuses a dispatch whose client_payload has more than 10
          # top-level fields, so a setting left at voice-job.yml's own default is
          # not sent, and witnesses only go with the path aligner (the phrase
          # matcher does not read them).
          if aligner != 'path':
              payload['aligner'] = aligner
          elif witnesses != 'hints,plain':
              payload['witnesses'] = witnesses
          if stt_model != 'scribe_v2':
              payload['sttModel'] = stt_model
          if os.environ.get('MAGGID'):
              payload['maggid'] = os.environ['MAGGID']
          assert len(payload) <= 10, f'client_payload has {len(payload)} top-level fields; GitHub allows 10'
          print(json.dumps({'event_type': 'run-voice-job', 'client_payload': payload}))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" -d @payload.json
          echo "Dispatched the regular engine's job; it publishes 'Regular #N' when it finishes."

  live:
    if: inputs.engines == 'both' || inputs.engines == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the live engine over the shiur
        working-directory: MDYsync
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
          REFS: ${{ inputs.refs }}
        run: |
          set -e
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "The ELEVENLABS_API_KEY repo secret is not set."
            exit 1
          fi
          node tools/test-shiur/live-engine.mjs --video-id "$VIDEO_ID" --elevenlabs --fetch-transcript \
            --out-words /tmp/words.json --refs "$REFS" --out /tmp/alignment.json

      - name: Publish it as the next numbered "Live #N" run
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          REFS: ${{ inputs.refs }}
          NOTES: ${{ inputs.notes }}
          ENGINE_VERSION: ${{ github.sha }}
        run: |
          set -e
          git config user.name "dafsync-bot"
          git config user.email "dafsync-bot@users.noreply.github.com"
          git fetch origin results
          git worktree add /tmp/results-checkout origin/results
          python3 MDYsync/tools/caption-sync/test_runs.py publish \
            --alignment /tmp/alignment.json \
            --out-dir /tmp/results-checkout \
            --video-id "$VIDEO_ID" \
            --engine live \
            --notes "$NOTES" \
            --engine-version "${ENGINE_VERSION:0:7}"
          cd /tmp/results-checkout
          git add test-runs
          git commit -m "Add a live-engine test run for ${VIDEO_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:results; then
              break
            fi
            git fetch origin results
            git rebase origin/results
            sleep 2
          done
