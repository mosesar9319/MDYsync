name: Server-side voice recognition job

# Triggered by the trigger-voice-job Netlify Function on an admin's behalf
# (never called directly with a public token) from the sync dialog's "Voice
# recognition (beta)" tab. Downloads the video (YouTube only for now, same
# channel restriction trigger-voice-job.mjs enforces before dispatch), runs
# voice_align.py (a pretrained speech model anchored against the daf's
# canonical text -- see that script's own docstring), and publishes the
# result to the `results` branch exactly the way ocr-job.yml does, so the
# player can't tell the two apart -- same results/by-ref/<ref>.json path,
# same polling, same schema.
#
# Kept as its own workflow rather than folded into ocr-job.yml: the
# dependencies barely overlap (faster-whisper/torch vs tesseract/opencv),
# and every OCR run installing a speech model it'll never use (or vice
# versa) would slow down both paths for no benefit.

on:
  repository_dispatch:
    types: [run-voice-job]

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    # CPU-bound whisper transcription runs at roughly 1.76x real-time on a
    # standard 4-core runner (measured against a real 5:15 clip) -- a 40-min
    # shiur alone needs ~70 min just to transcribe, before download/setup
    # overhead, so 60 wasn't enough (copied from ocr-job.yml without
    # checking it fit this much slower CPU-bound workload). 180 leaves
    # headroom up to roughly a 90-100 min shiur at this same ratio.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        # opencv-python-headless/pytesseract are never actually used by this
        # engine, but voice_align.py imports shared text-matching helpers
        # (CanonWord, build_outputs, load_canonical, normalize_word) from
        # caption_ocr_align.py, which does a module-level `import cv2` for
        # its own OCR/video-frame code -- that import fails the whole module
        # (and so voice_align.py's import of it) without these installed,
        # even though nothing here calls into the OCR-specific parts of it.
        run: pip install faster-whisper rapidfuzz yt-dlp opencv-python-headless pytesseract

      # Lets yt-dlp solve YouTube's signature-decipher JS challenge itself --
      # see ocr-job.yml's own copy of these two steps for the full story on
      # why both this and the PO token provider below are needed.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start the PO token provider
        run: |
          pip install bgutil-ytdlp-pot-provider
          docker run --name bgutil-provider -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO token provider is up."
              exit 0
            fi
            sleep 2
          done
          echo "PO token provider never became ready:"
          docker logs bgutil-provider || true
          exit 1

      - name: Download the video from YouTube
        working-directory: MDYsync/tools/caption-sync
        env:
          YOUTUBE_URL: ${{ github.event.client_payload.youtubeUrl }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -e
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "YOUTUBE_COOKIES repo secret is not set -- see ocr-job.yml's" \
                 "own copy of this step for what it needs to be."
            exit 1
          fi
          printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
          # Audio only (bestaudio) -- this engine never looks at video
          # frames, unlike the OCR path, so there's no reason to fetch or
          # mux a video stream at all.
          yt-dlp --cookies cookies.txt \
            --remote-components ejs:github \
            -f "bestaudio/best" \
            -x --audio-format mp3 --audio-quality 0 \
            -o job-audio.mp3 "$YOUTUBE_URL"
          rm -f cookies.txt
          size=$(stat -c%s job-audio.mp3)
          echo "Downloaded $size bytes"
          if [ "$size" -lt 100000 ]; then
            echo "Downloaded file is suspiciously small for audio."
            exit 1
          fi
          ls -la job-audio.mp3

      - name: Run the voice alignment engine
        working-directory: MDYsync/tools/caption-sync
        env:
          REFS_JSON: ${{ toJSON(github.event.client_payload.refs) }}
          # Which transcription engine voice_align.py uses. Defaults to the
          # local whisper model; set the ELEVENLABS_API_KEY repo secret and
          # this picks up ElevenLabs Scribe automatically instead (real
          # multilingual code-switching + a proper keyterm bias list, neither
          # of which the local path can do -- see transcribe_elevenlabs).
          # Without the secret set, `secrets.*` is an empty string, so this
          # stays on whisper and nothing about the existing job changes.
          # voice_align.py also falls back to whisper on its own if the API
          # call fails mid-job, so a rate limit or outage degrades the run
          # rather than failing it.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ENGINE: ${{ secrets.ELEVENLABS_API_KEY != '' && 'elevenlabs' || 'whisper' }}
        run: |
          python3 voice_align.py job-audio.mp3 \
            --refs-json "$REFS_JSON" \
            --model small \
            --out-dir job-out

      - name: Publish the result to the results branch
        env:
          JOB_ID: ${{ github.event.client_payload.jobId }}
          REFS_JSON: ${{ toJSON(github.event.client_payload.refs) }}
          VARIANT: ${{ github.event.client_payload.variant }}
          LANGUAGE: ${{ github.event.client_payload.language }}
          # Which recording these timestamps were measured against -- stamped
          # into the published file so the reader can verify it rather than
          # assuming whatever video-links happens to point at.
          VIDEO_URL: ${{ github.event.client_payload.youtubeUrl }}
        run: |
          set -e
          mkdir -p /tmp/results-checkout
          git config user.name "dafsync-bot"
          git config user.email "dafsync-bot@users.noreply.github.com"

          git fetch origin results 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/results; then
            git worktree add /tmp/results-checkout origin/results
          else
            git worktree add --detach /tmp/results-checkout
            (cd /tmp/results-checkout && git checkout --orphan results && git rm -rf . >/dev/null 2>&1 || true)
          fi

          # --voice keeps this engine's results under their own key namespace,
          # entirely separate from ocr-job.yml's, so a caption-OCR sync and a
          # voice sync started on the same daf never race to overwrite each
          # other's result (the player fetches both and lets the reader pick).
          # See publish_alignment.py for why a covered ref no longer
          # automatically gets its own by-ref entry.
          python3 MDYsync/tools/caption-sync/publish_alignment.py \
            --alignment MDYsync/tools/caption-sync/job-out/alignment.json \
            --refs-json "$REFS_JSON" \
            --out-dir /tmp/results-checkout \
            --job-id "$JOB_ID" \
            --variant "$VARIANT" \
            --language "$LANGUAGE" \
            --video-url "$VIDEO_URL" \
            --voice

          cd /tmp/results-checkout
          git add by-ref by-video
          git commit -m "Add voice-recognition result for job ${JOB_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:results; then
              break
            fi
            git fetch origin results
            git rebase origin/results
            sleep 2
          done
