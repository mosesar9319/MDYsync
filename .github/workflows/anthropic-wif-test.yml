name: anthropic-wif-test

# One-time diagnostic to verify the Claude Console's Workload Identity
# Federation setup (Settings -> Workload identity -> Connect workload ->
# GitHub Actions) actually works before it's relied on anywhere real. Not
# used by any other workflow -- safe to delete once the Console's "Test
# connection" step (Step 4 of the wizard) shows a successful exchange in
# the authentication log.
on: push

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01AtYN9MAYUPtY4cZQyXsbyc",
            "organization_id": "74d376cd-dbe1-4433-9451-95c6e803b4cf",
            "service_account_id": "svac_01K7UViJoUA8BYZqkTSFrEpu",
            "workspace_id": "wrkspc_01Kd4TUMsuNEyVL7WLvpxiHL"
          }
          JSON
