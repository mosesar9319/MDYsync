name: Place a shiur again from its saved transcripts

# A voice sync keeps what it heard (transcripts/<video id>.json.gz on the results
# branch; see the "Keep the transcripts" step of voice-job.yml). This places the
# same shiur on the daf again from that file, with the engine as it is on the
# branch it is run from -- so a change to the engine can be tried on a real
# shiur, or brought to shiurim already synced, without transcribing anything.
# It reads no audio and makes no ElevenLabs call -- unless "fill_skipped" is on.
#
# With "fill_skipped", the stretches of speech the saved transcript has no
# words for (ElevenLabs sometimes returns nothing for minutes of a shiur; see
# fill_skipped in voice_align.py) are transcribed now, from the recording
# itself, and the transcripts are kept again with them in. That costs ElevenLabs
# credits for those minutes only. A new sync does this by itself; this is for a
# shiur synced before it did. The shiur's kept answers (below) were given for
# the transcript as it was, so they are dropped when anything is heard, and the
# holes are to be answered again.
#
# With "claude" on (the default), Claude is asked about the holes the path leaves
# (tools/caption-sync/llm_patch.py), which costs Claude usage -- about what one
# sync's does -- and only works from main: the Anthropic workload identity rule
# is scoped to this repository's main branch. From any other branch the request
# is refused and the shiur is placed without it.
#
# Holes answered in a Claude Code session instead of by the API: Claude reads
# the questions (voice_align.py --patch-questions, from the saved transcripts)
# and starts this workflow with its answers (llm_patch.ANSWERS_SCHEMA) in the
# "answers" input. They are kept on the results branch as
# patch-answers/<video id>.json and used from there on every later run for the
# shiur, through the same checks as an answer from the API, and no API call is
# made. No pull request is needed for a shiur's answers: like a sync, they are
# results. (An answer that no longer fits a hole, after a change to the engine,
# is simply not used.)
#
# The result is filed as the shiur's next numbered test run
# (tools/caption-sync/test_runs.py). The player shows a shiur's run with the most
# daf words matched unless an admin picked another, so a better placement is
# seen at once and a worse one is not. With "publish" it also replaces the
# shiur's own sync (by-ref/ and by-video/), which is what a shiur without test
# runs is shown from.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "The shiur's id: Lakewood Daf Yomi's (L0213511665) or a YouTube id"
        required: true
      publish:
        description: "Also replace the shiur's own sync (otherwise it is filed as a test run only)"
        type: boolean
        default: false
      claude:
        description: 'Ask Claude about the words the path could not place (costs Claude usage; main branch only)'
        type: boolean
        default: true
      notes:
        description: 'A note for the test run (what changed in the engine)'
        default: ''
      answers:
        description: 'Answers for the holes, given in a Claude Code session (JSON, dafsync-patch-answers-v1); kept on the results branch'
        default: ''
      fill_skipped:
        description: 'Also transcribe the stretches of speech the saved transcript skipped (ElevenLabs credits for those minutes only)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: realign-${{ inputs.video_id }}
  cancel-in-progress: false

jobs:
  realign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: MDYsync/tools/caption-sync/requirements-voice.txt

      # The same packages as the voice job: voice_align.py imports them all at
      # the top, whatever it ends up using.
      - name: Install Python dependencies
        run: pip install -r MDYsync/tools/caption-sync/requirements-voice.txt

      # Only to read the recording itself, for the stretches its transcript skipped.
      - name: Install ffmpeg
        if: inputs.fill_skipped
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # As in voice-job.yml: the job's own GitHub-signed token, which the
      # anthropic SDK exchanges for a short-lived Anthropic one.
      - name: Fetch GitHub OIDC token for Anthropic workload identity federation
        if: inputs.claude
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            fs.writeFileSync('${{ runner.temp }}/anthropic-oidc-token', token);

      - name: Place the shiur again
        working-directory: MDYsync/tools/caption-sync
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          ANSWERS: ${{ inputs.answers }}
          FILL_SKIPPED: ${{ inputs.fill_skipped }}
          # Given to the engine only when it is to transcribe skipped stretches.
          ELEVENLABS_API_KEY: ${{ inputs.fill_skipped && secrets.ELEVENLABS_API_KEY || '' }}
          VOICE_LLM_PATCH: ${{ inputs.claude && '1' || '0' }}
          # The same workload identity as voice-job.yml (see the notes there).
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01AtYN9MAYUPtY4cZQyXsbyc
          ANTHROPIC_ORGANIZATION_ID: 74d376cd-dbe1-4433-9451-95c6e803b4cf
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01K7UViJoUA8BYZqkTSFrEpu
          ANTHROPIC_WORKSPACE_ID: wrkspc_01Kd4TUMsuNEyVL7WLvpxiHL
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc-token
        run: |
          set -e
          case "$VIDEO_ID" in
            *[!A-Za-z0-9_-]*|'') echo "Not a video id: $VIDEO_ID"; exit 1 ;;
          esac
          git fetch origin results
          git worktree add --detach /tmp/results-checkout origin/results
          saved="/tmp/results-checkout/transcripts/${VIDEO_ID}.json.gz"
          if [ ! -f "$saved" ]; then
            echo "No transcripts are saved for $VIDEO_ID. A shiur synced before transcripts were kept has to be synced once more."
            exit 1
          fi
          python3 saved_transcripts.py meta --file "$saved" > /tmp/job.json
          cat /tmp/job.json
          # Answers given with this run replace the ones kept for the shiur.
          kept="/tmp/results-checkout/patch-answers/${VIDEO_ID}.json"
          answers=""
          if [ -n "$ANSWERS" ]; then
            mkdir -p "$(dirname "$kept")"
            printf '%s' "$ANSWERS" > /tmp/answers.json
            python3 -c "import json,sys,llm_patch; d=json.load(open('/tmp/answers.json')); assert d.get('videoId') in (None, sys.argv[1]), 'answers are for another shiur'; print(len(llm_patch.load_answers('/tmp/answers.json')), 'answer(s)')" "$VIDEO_ID"
            python3 -c "import json,sys; json.dump(json.load(open('/tmp/answers.json')), open(sys.argv[1], 'w', encoding='utf-8'), ensure_ascii=False, indent=1)" "$kept"
          fi
          if [ -f "$kept" ]; then
            answers="$kept"
            echo "Filling the holes from the answers given in a Claude Code session, not the API."
            export VOICE_LLM_PATCH=0
          fi
          refs="$(python3 -c "import json; print(json.dumps(json.load(open('/tmp/job.json'))['refs']))")"
          if [ "$FILL_SKIPPED" = "true" ]; then
            if [ -n "$ANSWERS" ]; then
              echo "Answers are for the transcript as it is. Fill the skipped stretches first, then answer the holes of the new transcript." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ -z "$ELEVENLABS_API_KEY" ]; then
              echo "There is no ElevenLabs key to transcribe with." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            # The recording the transcripts were made from, by the address kept
            # with them. Its length must be the transcripts' own, or the words
            # heard now would sit at the wrong moments.
            url="$(python3 -c "import json; print(json.load(open('/tmp/job.json')).get('videoUrl') or '')")"
            case "$url" in
              https://*youtube.com/*|https://youtu.be/*|'')
                echo "The saved transcripts do not name the recording's own file, so its skipped stretches cannot be read here. Sync the shiur again instead." | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
              https://*) ;;
              *) echo "Not an address to download from."; exit 1 ;;
            esac
            curl -sfL --retry 3 --max-time 900 -o job-audio.mp3 "$url"
            seconds=$(ffprobe -v error -show_entries format=duration -of csv=p=0 job-audio.mp3)
            kept_seconds="$(python3 -c "import json; print(json.load(open('/tmp/job.json')).get('seconds') or '')")"
            echo "Downloaded the recording: ${seconds:-unknown} s (the transcripts: ${kept_seconds} s)"
            if [ -z "$seconds" ] || ! awk -v a="$seconds" -v b="$kept_seconds" 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(d <= 3) }'; then
              echo "The recording is not the length the transcripts were made from." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            VOICE_LLM_PATCH=0 python3 voice_align.py job-audio.mp3 \
              --refs-json "$refs" \
              --saved-transcripts "$saved" \
              --fill-skipped --engine elevenlabs --no-fallback \
              --out-dir job-out
            if [ -f job-out/transcripts.json ]; then
              # Something was heard: the transcript is a new one. Answers kept
              # for the old one name its words by their place in it, so they go.
              echo "Skipped stretches were transcribed; the shiur's kept answers, if any, are dropped." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "TRANSCRIPTS_CHANGED=true" >> "$GITHUB_ENV"
              rm -f "$kept"
              exit 0
            fi
            echo "The saved transcript has no skipped stretch of speech; placing it as it is." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python3 voice_align.py job-audio.mp3 \
            --refs-json "$refs" \
            --saved-transcripts "$saved" \
            ${answers:+--patch-answers "$answers"} \
            --out-dir job-out

      - name: File the result
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          PUBLISH: ${{ inputs.publish }}
          NOTES: ${{ inputs.notes }}
          ENGINE_VERSION: ${{ github.sha }}
          JOB_ID: realign-${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "dafsync-bot"
          git config user.email "dafsync-bot@users.noreply.github.com"
          field() { python3 -c "import json,sys; print(json.load(open('/tmp/job.json')).get(sys.argv[1]) or '')" "$1"; }
          VIDEO_URL="$(field videoUrl)"
          MAGGID="$(field maggid)"
          VARIANT="$(field variant)"
          LANGUAGE="$(field language)"
          REFS_JSON="$(cat MDYsync/tools/caption-sync/job-out/refs.json)"
          out=MDYsync/tools/caption-sync/job-out/alignment.json

          if [ "$TRANSCRIPTS_CHANGED" = "true" ]; then
            # The transcripts with the skipped stretches heard, in the saved ones' place.
            python3 MDYsync/tools/caption-sync/saved_transcripts.py store \
              --transcripts MDYsync/tools/caption-sync/job-out/transcripts.json \
              --out-dir /tmp/results-checkout \
              --refs-json "$(python3 -c "import json; print(json.dumps(json.load(open('/tmp/job.json'))['refs']))")" \
              --job-id "$JOB_ID" \
              --video-url "$VIDEO_URL" \
              --video-id "$VIDEO_ID" \
              ${MAGGID:+--maggid "$MAGGID"} \
              ${VARIANT:+--variant "$VARIANT"} \
              ${LANGUAGE:+--language "$LANGUAGE"} \
              --engine-version "${ENGINE_VERSION:0:7}"
          fi
          credits=MDYsync/tools/caption-sync/job-out/credits.json
          export VIDEO_URL MAGGID REFS_JSON
          if [ -f "$credits" ]; then
            # What it cost, as voice-job.yml records a sync's.
            stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
            mkdir -p /tmp/results-checkout/credits
            python3 - "$stamp" "$credits" "/tmp/results-checkout/credits/${stamp}-${JOB_ID}.json" <<'PY'
          import json, os, sys
          record = json.load(open(sys.argv[2]))
          record.update({'at': sys.argv[1], 'jobId': os.environ.get('JOB_ID'), 'videoUrl': os.environ.get('VIDEO_URL') or None,
                         'maggid': os.environ.get('MAGGID') or None, 'testRun': False, 'filledSkipped': True,
                         'refs': json.loads(os.environ['REFS_JSON'])})
          json.dump(record, open(sys.argv[3], 'w'), indent=2)
          PY
          fi

          if [ "$PUBLISH" = "true" ]; then
            python3 MDYsync/tools/caption-sync/publish_alignment.py \
              --alignment "$out" \
              --refs-json "$REFS_JSON" \
              --out-dir /tmp/results-checkout \
              --job-id "$JOB_ID" \
              ${VARIANT:+--variant "$VARIANT"} \
              ${LANGUAGE:+--language "$LANGUAGE"} \
              --video-url "$VIDEO_URL" \
              --video-id "$VIDEO_ID" \
              ${MAGGID:+--maggid "$MAGGID"} \
              --voice
          fi
          python3 MDYsync/tools/caption-sync/test_runs.py publish \
            --alignment "$out" \
            --out-dir /tmp/results-checkout \
            --video-url "$VIDEO_URL" \
            --video-id "$VIDEO_ID" \
            --refs-json "$REFS_JSON" \
            --engine regular \
            --notes "placed again from saved transcripts (${BRANCH})${NOTES:+: $NOTES}" \
            --engine-version "${ENGINE_VERSION:0:7}" \
            --job-id "$JOB_ID"

          cd /tmp/results-checkout
          git add test-runs
          [ -d patch-answers ] && git add -A patch-answers
          [ -d credits ] && git add credits
          [ "$TRANSCRIPTS_CHANGED" = "true" ] && git add transcripts
          [ "$PUBLISH" = "true" ] && git add by-ref by-video
          git commit -q -m "Placed ${VIDEO_ID} again from its saved transcripts (${JOB_ID})"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:results; then
              break
            fi
            git fetch origin results
            git rebase origin/results
            sleep 2
          done
