name: Place a shiur again from its saved transcripts (no ElevenLabs)

# A voice sync keeps what it heard (transcripts/<video id>.json.gz on the results
# branch; see the "Keep the transcripts" step of voice-job.yml). This places the
# same shiur on the daf again from that file, with the engine as it is on the
# branch it is run from -- so a change to the engine can be tried on a real
# shiur, or brought to shiurim already synced, without transcribing anything.
# It reads no audio and makes no ElevenLabs call.
#
# The result is filed as the shiur's next numbered test run
# (tools/caption-sync/test_runs.py). The player shows a shiur's run with the most
# daf words matched unless an admin picked another, so a better placement is
# seen at once and a worse one is not. With "publish" it also replaces the
# shiur's own sync (by-ref/ and by-video/), which is what a shiur without test
# runs is shown from.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "The shiur's id: Lakewood Daf Yomi's (L0213511665) or a YouTube id"
        required: true
      publish:
        description: "Also replace the shiur's own sync (otherwise it is filed as a test run only)"
        type: boolean
        default: false
      notes:
        description: 'A note for the test run (what changed in the engine)'
        default: ''

permissions:
  contents: write

concurrency:
  group: realign-${{ inputs.video_id }}
  cancel-in-progress: false

jobs:
  realign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: MDYsync/tools/caption-sync/requirements-voice.txt

      # The same packages as the voice job: voice_align.py imports them all at
      # the top, whatever it ends up using.
      - name: Install Python dependencies
        run: pip install -r MDYsync/tools/caption-sync/requirements-voice.txt

      - name: Place the shiur again
        working-directory: MDYsync/tools/caption-sync
        env:
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          set -e
          case "$VIDEO_ID" in
            *[!A-Za-z0-9_-]*|'') echo "Not a video id: $VIDEO_ID"; exit 1 ;;
          esac
          git fetch origin results
          git worktree add --detach /tmp/results-checkout origin/results
          saved="/tmp/results-checkout/transcripts/${VIDEO_ID}.json.gz"
          if [ ! -f "$saved" ]; then
            echo "No transcripts are saved for $VIDEO_ID. A shiur synced before transcripts were kept has to be synced once more."
            exit 1
          fi
          python3 saved_transcripts.py meta --file "$saved" > /tmp/job.json
          cat /tmp/job.json
          python3 voice_align.py job-audio.mp3 \
            --refs-json "$(python3 -c "import json; print(json.dumps(json.load(open('/tmp/job.json'))['refs']))")" \
            --saved-transcripts "$saved" \
            --out-dir job-out

      - name: File the result
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          PUBLISH: ${{ inputs.publish }}
          NOTES: ${{ inputs.notes }}
          ENGINE_VERSION: ${{ github.sha }}
          JOB_ID: realign-${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "dafsync-bot"
          git config user.email "dafsync-bot@users.noreply.github.com"
          field() { python3 -c "import json,sys; print(json.load(open('/tmp/job.json')).get(sys.argv[1]) or '')" "$1"; }
          VIDEO_URL="$(field videoUrl)"
          MAGGID="$(field maggid)"
          VARIANT="$(field variant)"
          LANGUAGE="$(field language)"
          REFS_JSON="$(cat MDYsync/tools/caption-sync/job-out/refs.json)"
          out=MDYsync/tools/caption-sync/job-out/alignment.json

          if [ "$PUBLISH" = "true" ]; then
            python3 MDYsync/tools/caption-sync/publish_alignment.py \
              --alignment "$out" \
              --refs-json "$REFS_JSON" \
              --out-dir /tmp/results-checkout \
              --job-id "$JOB_ID" \
              ${VARIANT:+--variant "$VARIANT"} \
              ${LANGUAGE:+--language "$LANGUAGE"} \
              --video-url "$VIDEO_URL" \
              --video-id "$VIDEO_ID" \
              ${MAGGID:+--maggid "$MAGGID"} \
              --voice
          fi
          python3 MDYsync/tools/caption-sync/test_runs.py publish \
            --alignment "$out" \
            --out-dir /tmp/results-checkout \
            --video-url "$VIDEO_URL" \
            --video-id "$VIDEO_ID" \
            --refs-json "$REFS_JSON" \
            --engine regular \
            --notes "placed again from saved transcripts (${BRANCH})${NOTES:+: $NOTES}" \
            --engine-version "${ENGINE_VERSION:0:7}" \
            --job-id "$JOB_ID"

          cd /tmp/results-checkout
          git add test-runs
          [ "$PUBLISH" = "true" ] && git add by-ref by-video
          git commit -q -m "Placed ${VIDEO_ID} again from its saved transcripts (${JOB_ID})"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:results; then
              break
            fi
            git fetch origin results
            git rebase origin/results
            sleep 2
          done
