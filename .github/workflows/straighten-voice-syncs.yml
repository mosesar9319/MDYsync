name: Put published voice syncs on one straight path

# Voice syncs made before November 2026 placed every saying of a phrase, so a daf
# word could stand at several moments and the highlight stepped back to follow
# each repeat. The engine now gives each word one moment, the first time it is
# read in the order of the page. This does the same to the syncs already on the
# results branch (tools/caption-sync/straighten_alignment.py): from the sync
# itself, with no audio, no transcript and no ElevenLabs call.
#
# Run it once after the engine change is merged. It leaves alone whatever is
# straight already, and the caption-based syncs, so it is safe to run again.
# A shiur whose transcripts were kept is better placed again with realign.yml.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Only this recording's syncs (its Lakewood Daf Yomi or YouTube id); empty for every voice sync"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: straighten-voice-syncs
  cancel-in-progress: false

jobs:
  straighten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: MDYsync/tools/caption-sync/requirements-voice.txt

      - name: Install Python dependencies
        run: pip install -r MDYsync/tools/caption-sync/requirements-voice.txt

      - name: Straighten the syncs
        env:
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          set -e
          case "$VIDEO_ID" in
            *[!A-Za-z0-9_-]*) echo "Not a video id: $VIDEO_ID"; exit 1 ;;
          esac
          git config user.name "dafsync-bot"
          git config user.email "dafsync-bot@users.noreply.github.com"
          git fetch origin results
          git worktree add --detach /tmp/results-checkout origin/results
          cd MDYsync/tools/caption-sync
          python3 straighten_alignment.py --results /tmp/results-checkout \
            ${VIDEO_ID:+--video-id "$VIDEO_ID"} --cache-dir /tmp/straighten-cache
          cd /tmp/results-checkout
          git add by-ref by-video test-runs
          if git diff --cached --quiet; then
            echo "Every voice sync is straight already."
            exit 0
          fi
          git commit -q -m "Voice syncs on one straight path${VIDEO_ID:+ ($VIDEO_ID)}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:results; then
              break
            fi
            git fetch origin results
            git rebase origin/results
            sleep 2
          done
