name: Server-side caption OCR job

# Triggered by the trigger-ocr-job Netlify Function on the user's behalf
# (never called directly with a public token) when someone uses the
# "Google Drive link" or "YouTube link" tab of the website's sync dialog --
# exactly one of client_payload.driveUrl/youtubeUrl is set, gating which
# download step below runs. (YouTube sync is restricted to one specific
# channel; that check happens in trigger-ocr-job.mjs before dispatch, not
# here -- this workflow trusts whatever dispatched it, same as the Drive
# path always has.) Downloads the video, runs the same OCR engine used by
# the desktop app and CLI unchanged, and publishes the alignment JSON to
# the `results` branch,
# once per daf reference it covers (results/by-ref/<ref>.json), which the
# website polls for via raw.githubusercontent.com (public repo, no auth
# needed to read it). Keying by daf reference rather than a random job ID
# means any device can look up an already-synced daf directly -- the sync
# isn't tied to the browser that started the job.

on:
  repository_dispatch:
    types: [run-ocr-job]

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract with Hebrew
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-heb ffmpeg

      - name: Install Python dependencies
        run: pip install opencv-python-headless pytesseract rapidfuzz "gdown==6.1.0" yt-dlp

      # Lets yt-dlp solve YouTube's signature-decipher JS challenge itself
      # instead of degrading extraction without one. Only installed for a
      # YouTube-sourced job; the Drive path has no use for it. (This does
      # NOT address the separate "Sign in to confirm you're not a bot" gate
      # below -- that one only backs off for an authenticated session,
      # which is what YOUTUBE_COOKIES supplies.)
      - uses: denoland/setup-deno@v2
        if: ${{ github.event.client_payload.youtubeUrl }}
        with:
          deno-version: v2.x

      # Even with valid cookies and a working JS-challenge solver, YouTube
      # gates the actual media URLs behind a "PO token" tied to the session
      # -- without one they return 403 (confirmed here on both the web and
      # tv clients). yt-dlp can't mint these itself; it delegates to a
      # provider. bgutil is the standard one: a small HTTP service the
      # companion yt-dlp plugin queries on demand, both from the same
      # project and released in lockstep (hence unpinned -- a plugin newer
      # than its provider is the usual mismatch failure).
      - name: Start the PO token provider
        if: ${{ github.event.client_payload.youtubeUrl }}
        run: |
          pip install bgutil-ytdlp-pot-provider
          docker run --name bgutil-provider -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          # The plugin auto-discovers the provider on 127.0.0.1:4416, but
          # only once it's actually listening -- yt-dlp would otherwise
          # silently fall back to token-less (403-ing) extraction.
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO token provider is up."
              exit 0
            fi
            sleep 2
          done
          echo "PO token provider never became ready:"
          docker logs bgutil-provider || true
          exit 1

      - name: Download the video from Google Drive
        if: ${{ github.event.client_payload.driveUrl }}
        working-directory: MDYsync/tools/caption-sync
        env:
          DRIVE_URL: ${{ github.event.client_payload.driveUrl }}
        run: |
          python3 -c "
          import gdown, os, sys
          result = gdown.download(url=os.environ['DRIVE_URL'], output='job-video.mp4', quiet=False)
          if not result:
              print('gdown could not resolve this link — check the file is shared as \"Anyone with the link\".')
              sys.exit(1)
          size = os.path.getsize('job-video.mp4')
          print(f'Downloaded {size} bytes')
          if size < 100_000:
              print('Downloaded file is suspiciously small for a video — likely a Drive '
                    'permission/interstitial page was saved instead of the real file.')
              sys.exit(1)
          "
          ls -la job-video.mp4

      - name: Download the video from YouTube
        if: ${{ github.event.client_payload.youtubeUrl }}
        working-directory: MDYsync/tools/caption-sync
        env:
          YOUTUBE_URL: ${{ github.event.client_payload.youtubeUrl }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -e
          # Capped at 720p -- plenty for OCR'ing the on-screen caption box,
          # and much faster to fetch than the highest available format.
          # ffmpeg (installed above) is what muxes the separate video/audio
          # streams into one mp4.
          #
          # GitHub Actions' shared runner IPs hit YouTube's "Sign in to
          # confirm you're not a bot" wall almost every time -- confirmed
          # this isn't fixed by player-client selection or by giving yt-dlp
          # a JS runtime (both tried and failed); only an authenticated
          # session gets past it. YOUTUBE_COOKIES is a cookies.txt export
          # (Netscape format) from a signed-in browser, set as a repo
          # secret -- use a secondary/throwaway account for it, not a
          # personal one, since an automated job holds and uses it on
          # every run.
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "YOUTUBE_COOKIES repo secret is not set. YouTube sync needs a" \
                 "cookies.txt export from a signed-in account to get past" \
                 "YouTube's bot-check wall on GitHub Actions runners -- see" \
                 "this step's comments for what to set and why."
            exit 1
          fi
          printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
          # deno alone isn't enough -- yt-dlp only fetches the actual JS
          # challenge-solver script (needed to decipher the signature/"n"
          # parameter real video formats are gated behind) when explicitly
          # told to, since pulling remote code to execute is opt-in by
          # design. Without this, deciphering fails silently and only
          # thumbnail-image formats end up "available".
          # No player_client pin: an earlier guess that only "web" needed a
          # PO token was wrong ("tv" 403s identically), so there's no client
          # to steer toward -- the bgutil provider started above supplies
          # tokens for whichever yt-dlp picks. ("android" self-skips anyway,
          # since it can't use cookies.)
          # vcodec^=avc1 (H.264) is load-bearing, not a preference: "ext=mp4"
          # alone also matches YouTube's AV1 streams, and OpenCV on this
          # runner can't decode AV1 -- every frame read fails and the OCR
          # pass silently matches 0 samples. Falls back to avc1 at any
          # resolution before it accepts a non-avc1 stream.
          yt-dlp --cookies cookies.txt \
            --remote-components ejs:github \
            -f "bv*[height<=720][vcodec^=avc1]+ba/b[height<=720][vcodec^=avc1]/bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*[height<=720]+ba/b" \
            --merge-output-format mp4 -o job-video.mp4 "$YOUTUBE_URL"
          rm -f cookies.txt
          size=$(stat -c%s job-video.mp4)
          echo "Downloaded $size bytes"
          if [ "$size" -lt 100000 ]; then
            echo "Downloaded file is suspiciously small for a video."
            exit 1
          fi
          ls -la job-video.mp4

      - name: Run the OCR alignment engine
        working-directory: MDYsync/tools/caption-sync
        env:
          REFS_JSON: ${{ toJSON(github.event.client_payload.refs) }}
        run: |
          python3 caption_ocr_align.py job-video.mp4 \
            --refs-json "$REFS_JSON" \
            --out-dir job-out

      - name: Publish the result to the results branch
        env:
          JOB_ID: ${{ github.event.client_payload.jobId }}
          REFS_JSON: ${{ toJSON(github.event.client_payload.refs) }}
          VARIANT: ${{ github.event.client_payload.variant }}
          LANGUAGE: ${{ github.event.client_payload.language }}
        run: |
          set -e
          mkdir -p /tmp/results-checkout
          git config user.name "dafsync-bot"
          git config user.email "dafsync-bot@users.noreply.github.com"

          git fetch origin results 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/results; then
            git worktree add /tmp/results-checkout origin/results
          else
            git worktree add --detach /tmp/results-checkout
            (cd /tmp/results-checkout && git checkout --orphan results && git rm -rf . >/dev/null 2>&1 || true)
          fi

          mkdir -p /tmp/results-checkout/by-ref
          python3 -c "
          import json, re, os
          refs = json.loads('''$REFS_JSON''')
          # A 'Chazarah Daf' reading (the shorter, gemara-only-review recording
          # of the same daf) and/or a Hebrew-language recording are namespaced
          # under their own prefix(es), composed in this order, so none of the
          # four variant/language combinations collide -- must match
          # trigger-ocr-job.mjs's and the frontend's own refKey() exactly.
          prefix = ('Hebrew-' if os.environ.get('LANGUAGE') == 'he' else '') + \
                   ('Chazarah-Daf-' if os.environ.get('VARIANT') == 'chazarah' else '')
          with open('MDYsync/tools/caption-sync/job-out/alignment.json') as f:
              alignment = json.load(f)
          # Stamped so the frontend's poll loop can tell a freshly published
          # result for THIS job apart from an older file that already existed
          # under the same ref (e.g. a prior sync's first-listed ref) -- without
          # this, polling by ref path alone reports 'done' the instant it sees
          # any file there, stale or not.
          alignment['jobId'] = os.environ.get('JOB_ID')
          for ref in refs:
              key = prefix + re.sub(r'\s+', '-', ref.strip())
              with open(f'/tmp/results-checkout/by-ref/{key}.json', 'w') as f:
                  json.dump(alignment, f, ensure_ascii=False, indent=2)
              print(f'Published for {ref} -> by-ref/{key}.json')
          "

          cd /tmp/results-checkout
          git add by-ref
          git commit -m "Add OCR result for job ${JOB_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:results; then
              break
            fi
            git fetch origin results
            git rebase origin/results
            sleep 2
          done
