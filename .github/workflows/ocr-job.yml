name: Server-side caption OCR job

# Triggered by the trigger-ocr-job Netlify Function on the user's behalf
# (never called directly with a public token) when someone uses the
# "Google Drive link" or "YouTube link" tab of the website's sync dialog --
# exactly one of client_payload.driveUrl/youtubeUrl is set, gating which
# download step below runs. (YouTube sync is restricted to one specific
# channel; that check happens in trigger-ocr-job.mjs before dispatch, not
# here -- this workflow trusts whatever dispatched it, same as the Drive
# path always has.) Downloads the video, runs the same OCR engine used by
# the desktop app and CLI unchanged, and publishes the alignment JSON to
# the `results` branch,
# once per daf reference it covers (results/by-ref/<ref>.json), which the
# website polls for via raw.githubusercontent.com (public repo, no auth
# needed to read it). Keying by daf reference rather than a random job ID
# means any device can look up an already-synced daf directly -- the sync
# isn't tied to the browser that started the job.

on:
  repository_dispatch:
    types: [run-ocr-job]
  # Lets a repo collaborator (or this session, via the Actions API) fire a
  # job by hand -- e.g. to re-sync a video whose already-published alignment
  # needs regenerating after a matching-engine fix, without going through
  # the website's dialog one video at a time. Same job body either way (see
  # the "Normalize job input" step below): every later step reads
  # steps.job_input.outputs.* rather than github.event.client_payload.*
  # directly, so it doesn't care which trigger fired it.
  workflow_dispatch:
    inputs:
      driveUrl:
        description: 'Google Drive share link (leave blank if using youtubeUrl)'
        required: false
        type: string
      youtubeUrl:
        description: 'YouTube video URL (leave blank if using driveUrl)'
        required: false
        type: string
      refs:
        description: 'JSON array of Sefaria refs this recording covers, in reading order, e.g. ["Chullin 137b","Chullin 138a","Chullin 138b"]'
        required: true
        type: string
      variant:
        required: false
        type: choice
        options: [regular, chazarah]
        default: regular
      language:
        required: false
        type: choice
        options: [en, he]
        default: en

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    # 60 was fine when every job's video was already a finished upload. The
    # channel airs each shiur live first (see the YouTube-download step's
    # own --live-from-start comment) and this job can be dispatched the
    # moment it goes live -- when that happens, yt-dlp now blocks recording
    # for however much of the ~60-90 min broadcast is still left before it
    # can even start the OCR pass. 180 leaves headroom for a live-wait
    # anywhere up to a long shiur's full length plus the original
    # download+OCR budget.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # See the workflow_dispatch trigger's own comment: this is the one
      # place that knows which event fired the job, so every step after it
      # can read steps.job_input.outputs.* unconditionally. All values pass
      # through env: (never interpolated straight into the shell script) so
      # a URL/ref containing shell-special characters can't inject into this
      # step -- same discipline the Drive/YouTube download steps below
      # already use for the same reason.
      - name: Normalize job input
        id: job_input
        env:
          WD_DRIVE_URL: ${{ github.event.inputs.driveUrl }}
          WD_YOUTUBE_URL: ${{ github.event.inputs.youtubeUrl }}
          WD_VARIANT: ${{ github.event.inputs.variant }}
          WD_LANGUAGE: ${{ github.event.inputs.language }}
          WD_REFS_JSON: ${{ github.event.inputs.refs }}
          RD_DRIVE_URL: ${{ github.event.client_payload.driveUrl }}
          RD_YOUTUBE_URL: ${{ github.event.client_payload.youtubeUrl }}
          RD_VARIANT: ${{ github.event.client_payload.variant }}
          RD_LANGUAGE: ${{ github.event.client_payload.language }}
          RD_JOB_ID: ${{ github.event.client_payload.jobId }}
          RD_REFS_JSON: ${{ toJSON(github.event.client_payload.refs) }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "driveUrl=$WD_DRIVE_URL"
              echo "youtubeUrl=$WD_YOUTUBE_URL"
              echo "variant=${WD_VARIANT:-regular}"
              echo "language=${WD_LANGUAGE:-en}"
              echo "jobId=manual-${{ github.run_id }}"
            } >> "$GITHUB_OUTPUT"
            { echo "refsJson<<JOBINPUT_EOF"; echo "$WD_REFS_JSON"; echo "JOBINPUT_EOF"; } >> "$GITHUB_OUTPUT"
          else
            {
              echo "driveUrl=$RD_DRIVE_URL"
              echo "youtubeUrl=$RD_YOUTUBE_URL"
              echo "variant=$RD_VARIANT"
              echo "language=$RD_LANGUAGE"
              echo "jobId=$RD_JOB_ID"
            } >> "$GITHUB_OUTPUT"
            { echo "refsJson<<JOBINPUT_EOF"; echo "$RD_REFS_JSON"; echo "JOBINPUT_EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract with Hebrew
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-heb ffmpeg

      - name: Install Python dependencies
        run: pip install opencv-python-headless pytesseract rapidfuzz "gdown==6.1.0" yt-dlp

      # Lets yt-dlp solve YouTube's signature-decipher JS challenge itself
      # instead of degrading extraction without one. Only installed for a
      # YouTube-sourced job; the Drive path has no use for it. (This does
      # NOT address the separate "Sign in to confirm you're not a bot" gate
      # below -- that one only backs off for an authenticated session,
      # which is what YOUTUBE_COOKIES supplies.)
      - uses: denoland/setup-deno@v2
        if: ${{ steps.job_input.outputs.youtubeUrl }}
        with:
          deno-version: v2.x

      # Even with valid cookies and a working JS-challenge solver, YouTube
      # gates the actual media URLs behind a "PO token" tied to the session
      # -- without one they return 403 (confirmed here on both the web and
      # tv clients). yt-dlp can't mint these itself; it delegates to a
      # provider. bgutil is the standard one: a small HTTP service the
      # companion yt-dlp plugin queries on demand, both from the same
      # project and released in lockstep (hence unpinned -- a plugin newer
      # than its provider is the usual mismatch failure).
      - name: Start the PO token provider
        if: ${{ steps.job_input.outputs.youtubeUrl }}
        run: |
          pip install bgutil-ytdlp-pot-provider
          docker run --name bgutil-provider -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          # The plugin auto-discovers the provider on 127.0.0.1:4416, but
          # only once it's actually listening -- yt-dlp would otherwise
          # silently fall back to token-less (403-ing) extraction.
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO token provider is up."
              exit 0
            fi
            sleep 2
          done
          echo "PO token provider never became ready:"
          docker logs bgutil-provider || true
          exit 1

      - name: Download the video from Google Drive
        if: ${{ steps.job_input.outputs.driveUrl }}
        working-directory: MDYsync/tools/caption-sync
        env:
          DRIVE_URL: ${{ steps.job_input.outputs.driveUrl }}
        run: |
          python3 -c "
          import gdown, os, sys
          result = gdown.download(url=os.environ['DRIVE_URL'], output='job-video.mp4', quiet=False)
          if not result:
              print('gdown could not resolve this link — check the file is shared as \"Anyone with the link\".')
              sys.exit(1)
          size = os.path.getsize('job-video.mp4')
          print(f'Downloaded {size} bytes')
          if size < 100_000:
              print('Downloaded file is suspiciously small for a video — likely a Drive '
                    'permission/interstitial page was saved instead of the real file.')
              sys.exit(1)
          "
          ls -la job-video.mp4

      - name: Download the video from YouTube
        if: ${{ steps.job_input.outputs.youtubeUrl }}
        working-directory: MDYsync/tools/caption-sync
        env:
          YOUTUBE_URL: ${{ steps.job_input.outputs.youtubeUrl }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -e
          # Capped at 720p -- plenty for OCR'ing the on-screen caption box,
          # and much faster to fetch than the highest available format.
          # ffmpeg (installed above) is what muxes the separate video/audio
          # streams into one mp4.
          #
          # GitHub Actions' shared runner IPs hit YouTube's "Sign in to
          # confirm you're not a bot" wall almost every time -- confirmed
          # this isn't fixed by player-client selection or by giving yt-dlp
          # a JS runtime (both tried and failed); only an authenticated
          # session gets past it. YOUTUBE_COOKIES is a cookies.txt export
          # (Netscape format) from a signed-in browser, set as a repo
          # secret -- use a secondary/throwaway account for it, not a
          # personal one, since an automated job holds and uses it on
          # every run.
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "YOUTUBE_COOKIES repo secret is not set. YouTube sync needs a" \
                 "cookies.txt export from a signed-in account to get past" \
                 "YouTube's bot-check wall on GitHub Actions runners -- see" \
                 "this step's comments for what to set and why."
            exit 1
          fi
          printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
          # deno alone isn't enough -- yt-dlp only fetches the actual JS
          # challenge-solver script (needed to decipher the signature/"n"
          # parameter real video formats are gated behind) when explicitly
          # told to, since pulling remote code to execute is opt-in by
          # design. Without this, deciphering fails silently and only
          # thumbnail-image formats end up "available".
          # No player_client pin: an earlier guess that only "web" needed a
          # PO token was wrong ("tv" 403s identically), so there's no client
          # to steer toward -- the bgutil provider started above supplies
          # tokens for whichever yt-dlp picks. ("android" self-skips anyway,
          # since it can't use cookies.)
          # vcodec^=avc1 (H.264) is load-bearing, not a preference: "ext=mp4"
          # alone also matches YouTube's AV1 streams, and OpenCV on this
          # runner can't decode AV1 -- every frame read fails and the OCR
          # pass silently matches 0 samples. Falls back to avc1 at any
          # resolution before it accepts a non-avc1 stream.
          #
          # --live-from-start: the channel streams each shiur live (a Zoom
          # feed simulcast to YouTube) before it settles into a normal VOD,
          # and the hourly auto-sync poll can dispatch this job the moment a
          # video appears in the channel's feed -- which, for a live upload,
          # is the instant the broadcast starts, not when it ends. Without
          # this flag yt-dlp instead joins at the live edge and stops
          # whenever the job happens to run, so the captured file is a
          # truncated/offset slice of the real shiur; every OCR timestamp
          # then gets measured against that wrong recording instead of the
          # finished VOD the player actually loads, producing a duration/
          # alignment mismatch once the stream finalizes. This flag makes
          # yt-dlp instead record the complete broadcast from its true
          # start and only finish once the stream ends -- a no-op for a
          # video that's already a finished upload, so it's safe to pass
          # unconditionally rather than needing a separate live-status check
          # before deciding whether to download.
          yt-dlp --cookies cookies.txt \
            --remote-components ejs:github \
            --live-from-start \
            -f "bv*[height<=720][vcodec^=avc1]+ba/b[height<=720][vcodec^=avc1]/bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*[height<=720]+ba/b" \
            --merge-output-format mp4 -o job-video.mp4 "$YOUTUBE_URL"
          rm -f cookies.txt
          size=$(stat -c%s job-video.mp4)
          echo "Downloaded $size bytes"
          if [ "$size" -lt 100000 ]; then
            echo "Downloaded file is suspiciously small for a video."
            exit 1
          fi
          ls -la job-video.mp4

      - name: Run the OCR alignment engine
        working-directory: MDYsync/tools/caption-sync
        env:
          REFS_JSON: ${{ steps.job_input.outputs.refsJson }}
        run: |
          python3 caption_ocr_align.py job-video.mp4 \
            --refs-json "$REFS_JSON" \
            --out-dir job-out

      - name: Publish the result to the results branch
        env:
          JOB_ID: ${{ steps.job_input.outputs.jobId }}
          REFS_JSON: ${{ steps.job_input.outputs.refsJson }}
          VARIANT: ${{ steps.job_input.outputs.variant }}
          LANGUAGE: ${{ steps.job_input.outputs.language }}
          # Which recording this alignment's timestamps were actually measured
          # against -- stamped into the published file so the reader can check
          # it instead of assuming whatever video-links happens to point at.
          # Exactly one of the two is set (see this workflow's own comment).
          VIDEO_URL: ${{ steps.job_input.outputs.youtubeUrl || steps.job_input.outputs.driveUrl }}
        run: |
          set -e
          mkdir -p /tmp/results-checkout
          git config user.name "dafsync-bot"
          git config user.email "dafsync-bot@users.noreply.github.com"

          git fetch origin results 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/results; then
            git worktree add /tmp/results-checkout origin/results
          else
            git worktree add --detach /tmp/results-checkout
            (cd /tmp/results-checkout && git checkout --orphan results && git rm -rf . >/dev/null 2>&1 || true)
          fi

          # See publish_alignment.py's own module comment for why a covered
          # ref no longer automatically gets its own by-ref entry: a shiur
          # opens on the tail of the PREVIOUS daf, and letting that lead-in
          # coverage publish as that daf's alignment overwrote the neighbour's
          # own (fuller) one -- and, because nothing recorded which recording
          # an alignment's timestamps were measured from, left several dapim
          # serving one video's timestamps against a different video entirely.
          python3 MDYsync/tools/caption-sync/publish_alignment.py \
            --alignment MDYsync/tools/caption-sync/job-out/alignment.json \
            --refs-json "$REFS_JSON" \
            --out-dir /tmp/results-checkout \
            --job-id "$JOB_ID" \
            --variant "$VARIANT" \
            --language "$LANGUAGE" \
            --video-url "$VIDEO_URL"

          cd /tmp/results-checkout
          git add by-ref by-video
          git commit -m "Add OCR result for job ${JOB_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:results; then
              break
            fi
            git fetch origin results
            git rebase origin/results
            sleep 2
          done
