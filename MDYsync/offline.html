<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#132238">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<title>DafSync — No connection</title>
<style>
:root{--ink:#132238;--muted:#65748a;--bg:#f4f7fb;--card:#fff;--line:#d9e1eb;--accent:#2f6ea5}
@media (prefers-color-scheme:dark){:root{--ink:#eef2f7;--muted:#a3acb9;--bg:#0f1115;--card:#1b1e24;--line:#2b3039;--accent:#6aa7ff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 24px}
img{width:88px;height:auto}
h1{font-size:24px;margin:18px 0 8px}
p{color:var(--muted);margin:0 0 22px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a,button{font:inherit;font-weight:600;border-radius:999px;padding:11px 20px;min-height:44px;cursor:pointer;text-decoration:none}
button{border:0;background:var(--ink);color:var(--bg)}
a{border:1px solid var(--line);color:var(--ink);background:transparent}
</style>
</head>
<body>
<main>
  <img src="/assets/dafsync-mark.png" alt="" width="88" height="71">
  <h1>No connection</h1>
  <p>This page has not been opened on this device before, so it cannot be shown without a connection. Pages you have already opened still work.</p>
  <div class="actions">
    <button type="button" id="retry">Try again</button>
    <a href="/">Home</a>
  </div>
</main>
<script>
document.getElementById('retry').addEventListener('click', function () { location.reload(); });
// Back online: load the page that was asked for.
window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
