  <script>
    // Same dependency-free failure banner every other page carries, inline and
    // ahead of every other <script> so it still works when a stylesheet or
    // another script is the thing that failed. See chaburah/index.html.
    (function () {
      var shown = false;
      function showBanner(message) {
        if (shown) return;
        shown = true;
        var bar = document.createElement('div');
        bar.textContent = 'Something on this page failed to load: ' + message + ' -- try reloading the page.';
        bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#7c1d1d;color:#fff;'
          + 'font:14px/1.4 -apple-system,system-ui,sans-serif;padding:10px 40px 10px 14px;text-align:left;';
        var close = document.createElement('button');
        close.textContent = '×';
        close.setAttribute('aria-label', 'Dismiss');
        close.style.cssText = 'position:absolute;right:8px;top:6px;background:transparent;border:0;color:#fff;'
          + 'font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;';
        close.onclick = function () { bar.remove(); };
        bar.appendChild(close);
        document.body ? document.body.prepend(bar) : document.addEventListener('DOMContentLoaded', function () { document.body.prepend(bar); });
      }
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName !== 'SCRIPT') return;
        var src = event.target && event.target.src;
        var message = event.message || src || 'unknown error';
        showBanner(String(message));
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        showBanner(String(event.reason && event.reason.message || event.reason || 'unknown error'));
      });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;600;700&display=swap" rel="stylesheet">

<body data-page="calendar">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="DafSync home"><span class="brand-mark"><img src="/assets/dafsync-lockup.png" alt="" /></span></a>
    <nav class="desktop-navigation" aria-label="Primary navigation"></nav>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div class="mobile-brand"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/dafsync-mark.png" alt="" /></span><span class="brand-name" translate="no">DafSync</span></a></div>
      <div class="top-actions">
        <div class="auth-widget" id="authWidget">
          <button class="button secondary small lang-switch" type="button" data-lang-switch translate="no"></button>
          <button class="button secondary small" id="signInButton" type="button">Sign in</button>
          <div class="account-menu" id="accountMenu" hidden>
            <button class="button secondary small account-trigger" id="accountMenuButton" type="button">
              <span id="accountEmailLabel">Account</span>
              <span class="admin-badge admin-only" id="adminBadge">Admin</span>
            </button>
            <div class="account-dropdown" id="accountDropdown" hidden>
              <a class="account-dropdown-item admin-only" id="studioLink" href="/studio/">Open studio</a>
              <button class="account-dropdown-item" id="signOutButton" type="button">Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="cal" id="calendar">
      <header class="cal-head">
        <div class="cal-head-titles">
          <div class="cal-eyebrow">Daf Yomi calendar</div>
          <h1 id="calTitle" translate="no"></h1>
          <p id="calHebrewMonths" translate="no"></p>
        </div>
        <div class="cal-nav" role="group" aria-label="Month">
          <button type="button" class="cal-nav-arrow" id="calPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" class="cal-nav-today" id="calToday">Today</button>
          <button type="button" class="cal-nav-arrow" id="calNext" aria-label="Next month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </header>

      <section class="cal-summary" id="calSummary" aria-label="Where the daf is up to"></section>

      <div class="cal-layout">
        <section class="cal-card" aria-label="Month">
          <div class="cal-weekdays" id="calWeekdays" aria-hidden="true"></div>
          <div class="cal-grid" id="calGrid" role="grid"></div>
        </section>
        <aside class="cal-day" id="calDay" aria-live="polite"></aside>
      </div>
    </main>
  </div>

  <dialog id="authDialog">
    <button class="dialog-close" id="closeAuthDialog" aria-label="Close">×</button>
    <div class="eyebrow" id="authDialogEyebrow">Account</div>
    <h2 id="authDialogTitle">Sign in</h2>
    <p class="dialog-note" id="authDialogNote">Sign in to save favorites and resume a shiur where you left off.</p>
    <button class="button secondary google-auth-button" id="googleAuthButton" type="button">
      <svg viewBox="0 0 18 18" aria-hidden="true" width="18" height="18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.79 2.73v2.27h2.9c1.7-1.56 2.68-3.87 2.68-6.64z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.9-2.27c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96A8.996 8.996 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.99-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>
    <div class="auth-divider"><span>or</span></div>
    <form class="auth-form" id="authForm">
      <label class="sync-field">
        <span>Email</span>
        <input id="authEmail" type="email" autocomplete="email" required />
      </label>
      <label class="sync-field">
        <span>Password</span>
        <input id="authPassword" type="password" autocomplete="current-password" required minlength="6" />
      </label>
      <p class="auth-error" id="authError" hidden></p>
      <div class="auth-form-actions">
        <button class="button primary" id="authSubmitButton" type="submit">Sign in</button>
        <button class="button ghost small" id="authSwitchModeButton" type="button">Need an account? Sign up</button>
      </div>
    </form>
  </dialog>

  <script src="../vendor/supabase-js.min.js"></script>
  <script src="../auth.js"></script>
  <script src="../nav.js" defer></script>
  <script type="module" src="./calendar.js"></script>
</body>
</html>
