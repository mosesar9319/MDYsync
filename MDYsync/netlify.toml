[build]
  publish = "."
  functions = "netlify/functions"

# scan-daf-page.mjs's tesseract.js dependency needed its actual WASM OCR
# engine binaries (tesseract.js-core's *.wasm / *.wasm.js -- several MB
# each, one per CPU-feature variant that tesseract picks between at runtime)
# to reach production, and they weren't -- confirmed directly by running
# this project's real Netlify Functions bundler (@netlify/zip-it-and-ship-it,
# the "nft" bundler these .mjs functions use) locally: it correctly traces
# and includes tesseract.js's own JS files (its worker-thread spawn code
# and worker-script), but its static analysis can't follow the runtime,
# feature-detection-driven path that picks which *.wasm variant to load, so
# every one of them was silently left out of the deployed bundle. That
# produced a real, reproduced-live crash: the deployed function returned a
# raw 502 ("An unknown error has occurred") for every scan attempt, well
# before reaching any of scan-daf-page.mjs's own error handling. (Also
# confirmed the fix directly: rebundling with this config actually adds the
# *.wasm files -- 1.3MB to 19.8MB for this one function.)
#
# externalNodeModules (the more commonly reached-for fix for this class of
# bug) has NO effect here -- it's an esbuild-only option, and esbuild isn't
# the bundler in play for these functions. included_files is bundler-
# agnostic: it's applied by zip-it-and-ship-it itself as an explicit,
# glob-based addition, regardless of which bundler traced (or failed to
# trace) something. All CPU-feature variants are kept, not just the
# default, since which one the Lambda runtime's CPU actually gets offered
# is a runtime decision (wasm-feature-detect), not a build-time one --
# trimming to one variant risks the exact same crash for whichever runtime
# picks a different one. Scoped to just this function (not [functions]
# globally) so the other 12 functions -- none of which use tesseract.js --
# don't each also ship an extra ~18MB of OCR-engine binaries they never
# touch.
[functions."scan-daf-page"]
  included_files = ["node_modules/tesseract.js-core/*.wasm", "node_modules/tesseract.js-core/*.wasm.js"]

# scan-daf-header.mjs also imports tesseract.js (as its fallback engine when
# no Google Vision credential is configured -- see that file's own engine-
# selection comment) -- same untraceable runtime *.wasm-variant load, same
# fix, scoped to just this function for the same reason as above.
[functions."scan-daf-header"]
  included_files = ["node_modules/tesseract.js-core/*.wasm", "node_modules/tesseract.js-core/*.wasm.js"]

# --- Source directories that are not part of the website -------------------
#
# `publish = "."` above serves the whole repository directory, which is what
# the site's own pages, /vendor/, /assets/, /shared/ and /talmud_index.json
# rely on. It also, unintentionally, served everything else in that folder:
# confirmed live on production, https://dafsync.netlify.app/supabase/baseline/
# 00_current_production_schema.sql returned the complete schema -- every
# table, every RLS policy and every SECURITY DEFINER function body -- as did
# the migrations, the authorization tests, and docs/ (which includes a
# security audit).
#
# None of it is secret: this repository is public, and none of these files
# contain credentials. But serving them from the product's own domain hands
# anyone a precise map of the authorization rules, and there is no reason for
# the website to answer for its own source tree.
#
# force = true is LOAD-BEARING, not decoration. Netlify serves an existing
# static file in preference to a matching redirect rule; without force these
# rules would match nothing that actually exists, which is precisely the set
# of paths they are meant to stop. Verified against the deploy preview rather
# than assumed.
#
# Deliberately NOT blocked, because the browser really does load them:
#   /shared/*          player-chrome.js does import('/shared/daf-header-
#                      vocabulary.mjs') at runtime
#   /talmud_index.json fetched by the daf picker
#   /vendor/*          supabase-js and pdf.js
#   /scan-detect-worker.js, /heb.traineddata  the client-side scan path
#
# test-results/ needs no rule: it is gitignored, so it is never deployed.

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Dependency manifests and the test-runner config: they pin exact versions,
# which is free reconnaissance for anyone looking for a known CVE to try.
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/playwright.config.mjs"
  to = "/404.html"
  status = 404
  force = true

# Repository documentation. Listed one by one rather than as a /*.md glob:
# Netlify's splat matches across path segments, so a suffix pattern is not a
# reliable way to say "markdown at the root".
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PRODUCTION_ARCHITECTURE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CHULLIN_81_PILOT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/studio"
  to = "/studio/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The sitewide rule above locks camera access down everywhere by default --
# only the player page needs it, for the "scan a printed daf page" feature
# (see scan-daf-page.mjs). Netlify applies the most specific matching path's
# value for a given header when multiple [[headers]] blocks match the same
# request, so this overrides just the Permissions-Policy value here, not the
# other two.
[[headers]]
  for = "/player/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
