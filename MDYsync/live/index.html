<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/app/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DafSync">
  <script src="/i18n.js?v=11"></script>
  <script src="/pwa.js" defer></script>
  <title>Live Follow</title>
  <link rel="canonical" href="https://dafsync.com/browse/?live=1">
  <meta property="og:url" content="https://dafsync.com/browse/?live=1">
  <meta name="robots" content="noindex">
  <!-- Live Follow now lives on the Interactive Daf page, which already has the
       daf picker, the printed daf and the viewing modes. Old links (and any
       ?lang= / ?raw= / ?batch= options on them) are carried over. -->
  <meta http-equiv="refresh" content="0; url=../browse/?live=1" />
  <script>
    (function () {
      var query = location.search.replace(/^\?/, '');
      location.replace('../browse/?live=1' + (query ? '&' + query : ''));
    }());
  </script>
</head>
<body>
  <p>Live Follow has moved to <a href="../browse/?live=1">the Interactive Daf page</a>.</p>
</body>
</html>
