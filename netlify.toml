[build]
  base = "MDYsync"
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/studio"
  to = "/studio/"
  status = 301

[[redirects]]
  from = "/studio/*"
  to = "/studio/:splat"
  status = 200
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/studio/*"
  to = "/?editor=login"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
